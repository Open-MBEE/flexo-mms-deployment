{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flexo-mms.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flexo-mms.labels" . | nindent 4 }}
  {{- $annotations := merge (default (dict) .Values.serviceAccount.annotations) (default (dict) .Values.commonAnnotations) }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
