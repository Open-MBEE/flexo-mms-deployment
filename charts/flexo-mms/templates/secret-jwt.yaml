{{- if and (not .Values.jwt.existingSecret) (or .Values.layer1.enabled .Values.auth.enabled .Values.store.enabled .Values.sso.enabled) }}
{{- $meta := dict "root" . "component" "jwt" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flexo-mms.jwt.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flexo-mms.componentLabels" $meta | nindent 4 }}
  {{- with (include "flexo-mms.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{ .Values.jwt.existingSecretKey }}: {{ include "flexo-mms.jwt.secretValue" . | quote }}
{{- end }}
