{{- if and .Values.devStack.enabled (not .Values.devStack.openldap.existingSecret) }}
{{- $meta := dict "root" . "component" "openldap" "version" (toString .Values.devStack.openldap.image.tag) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flexo-mms.openldap.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flexo-mms.componentLabels" $meta | nindent 4 }}
  {{- with (include "flexo-mms.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  LDAP_ADMIN_PASSWORD: {{ .Values.devStack.openldap.adminPassword | quote }}
  LDAP_PASSWORDS: {{ join "," .Values.devStack.openldap.passwords | quote }}
{{- end }}
