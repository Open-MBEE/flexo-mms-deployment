{{- if and .Values.devStack.enabled (not .Values.devStack.minio.existingSecret) }}
{{- $meta := dict "root" . "component" "minio" "version" (toString .Values.devStack.minio.image.tag) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flexo-mms.minio.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flexo-mms.componentLabels" $meta | nindent 4 }}
  {{- with (include "flexo-mms.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  MINIO_ROOT_USER: {{ .Values.devStack.minio.rootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.devStack.minio.rootPassword | quote }}
{{- end }}
