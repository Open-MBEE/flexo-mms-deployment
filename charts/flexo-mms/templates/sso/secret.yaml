{{- if .Values.sso.enabled }}
{{- $clientSecret := and (not .Values.sso.oidc.existingSecret) .Values.sso.oidc.clientSecret }}
{{- $dbPassword := and (not .Values.sso.datasource.existingSecret) .Values.sso.datasource.password }}
{{- if or $clientSecret $dbPassword }}
{{- $meta := dict "root" . "component" "sso" "version" (toString .Values.sso.image.tag) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flexo-mms.sso.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flexo-mms.componentLabels" $meta | nindent 4 }}
  {{- with (include "flexo-mms.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- if $clientSecret }}
  {{ .Values.sso.oidc.existingSecretKey }}: {{ .Values.sso.oidc.clientSecret | quote }}
  {{- end }}
  {{- if $dbPassword }}
  {{ .Values.sso.datasource.existingSecretKey }}: {{ .Values.sso.datasource.password | quote }}
  {{- end }}
{{- end }}
{{- end }}
