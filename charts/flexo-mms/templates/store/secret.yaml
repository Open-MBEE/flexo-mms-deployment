{{- if and .Values.store.enabled (include "flexo-mms.s3.createSecret" .) }}
{{- $meta := dict "root" . "component" "s3" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flexo-mms.componentName" $meta }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flexo-mms.componentLabels" $meta | nindent 4 }}
  {{- with (include "flexo-mms.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{ .Values.s3.existingSecretKeys.accessKeyId }}: {{ required "s3.accessKeyId is required when s3.secretAccessKey is set" .Values.s3.accessKeyId | quote }}
  {{ .Values.s3.existingSecretKeys.secretAccessKey }}: {{ required "s3.secretAccessKey is required when s3.accessKeyId is set" .Values.s3.secretAccessKey | quote }}
{{- end }}
