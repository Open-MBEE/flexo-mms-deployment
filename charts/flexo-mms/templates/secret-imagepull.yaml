{{- if .Values.imagePullSecret.create }}
{{- $registry := required "imagePullSecret.registry is required" .Values.imagePullSecret.registry }}
{{- $username := required "imagePullSecret.username is required when imagePullSecret.create=true" .Values.imagePullSecret.username }}
{{- $password := required "imagePullSecret.password is required when imagePullSecret.create=true" .Values.imagePullSecret.password }}
{{- $auth := dict "username" $username "password" $password "auth" (printf "%s:%s" $username $password | b64enc) }}
{{- with .Values.imagePullSecret.email }}
{{- $_ := set $auth "email" . }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flexo-mms.imagePullSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flexo-mms.labels" . | nindent 4 }}
  {{- with (include "flexo-mms.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict $registry $auth) | toJson | b64enc | quote }}
{{- end }}
